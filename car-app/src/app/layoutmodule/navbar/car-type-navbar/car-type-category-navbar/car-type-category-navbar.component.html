<!-- Sub-navbar -->
<nav
  class="navbar navbar-expand-sm bg-light shadow-sm"
  aria-label="Select Vehicle categories"
  @submenuAnimation
>
  <div class="container d-flex justify-content-center">
    <ul class="navbar-nav">
      @for(item of carCategories; track item.id){
      <li class="nav-item"><a class="nav-link">{{item.name}}</a></li>
      }
    </ul>
  </div>
</nav>

<nav class="navbar navbar-expand-sm bg-light shadow-sm " *ngIf="selected.name === 'Bakkie'"aria-label="Select Bakkie category" @submenuAnimation>
  <div class="container d-flex justify-content-center">
    <ul class="navbar-nav ">
      <li class="nav-item"><a class="nav-link" >Single Cab</a></li>
      <li class="nav-item"><a class="nav-link" >Double Cab</a></li>
    </ul>
  </div>
</nav>

<nav class="navbar navbar-expand-sm bg-light shadow-sm" *ngIf="selected.name === 'bike'"aria-label="Select Bike category"@submenuAnimation>
  <div class="container d-flex justify-content-center">
    <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link" >Sport</a></li>
      <li class="nav-item"><a class="nav-link" >Cruiser</a></li>
    </ul>
  </div>
</nav>
