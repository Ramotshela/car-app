<div class="sub-nav-card">
  <h4>Find Your Perfect Car</h4>
  <p>Buy, rent, or bid on premium vehicles from trusted dealers</p>
  <input type="search" placeholder="search by make, model..." />
</div>
<app-filter [filters]="filters" [(activeFilter)]="selectedFilter"></app-filter>
<div class="card car-card shadow-sm border-0">
  <div
    id="carouselExampleAutoplaying"
    class="carousel slide"
    data-bs-ride="carousel"
  >
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img
          src="assets/images/BMW_M5_F90.jpg"
          class="d-block w-100"
          alt="..."
        />
      </div>
      <div class="carousel-item">
        <img
          src="assets/images/BMW_M5_F90.jpg"
          class="d-block w-100"
          alt="..."
        />
      </div>
      <div class="carousel-item">
        <img
          src="assets/images/BMW_M5_F90.jpg"
          class="d-block w-100"
          alt="..."
        />
      </div>
    </div>
    <button
      class="carousel-control-prev"
      type="button"
      data-bs-target="#carouselExampleAutoplaying"
      data-bs-slide="prev"
    >
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button
      class="carousel-control-next"
      type="button"
      data-bs-target="#carouselExampleAutoplaying"
      data-bs-slide="next"
    >
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>

  <div class="card-body">
    <h5 class="card-title fw-bold mb-2">BMW M5 F90</h5>

    <div class="d-flex justify-content-between text-muted mb-1">
      <small>100,000 km</small>
      <small>A Rated</small>
    </div>

    <div class="d-flex justify-content-between">
      <span class="text-primary fw-semibold">R1,200,000</span>
      <span class="text-success">R10,000/mo</span>
    </div>
  </div>
</div>
