
<!-- car-type.component.html -->
<div style="max-width: 400px; margin: 2rem auto; font-family: sans-serif;">
  <h2>Add Car Type</h2>

  <input [(ngModel)]="name" placeholder="Enter car type name" style="width: 100%; padding: 8px;" />

  <button (click)="addCarType()" style="margin-top: 10px; padding: 8px 12px;">
    Submit
  </button>

  <p style="margin-top: 15px;">{{ message }}</p>
</div>
